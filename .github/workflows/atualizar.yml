name: Atualizar apuração

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Buscar números no TSE
        env:
          ATUALIZAR_FORCADO: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python atualizar.py
      - name: Atualizar imagem de compartilhamento
        run: python gera_og.py
      - name: Publicar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json og.png
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza a apuração a partir do TSE"
          git push
